<section class="dFlex llsSec">
  <div class="llsSecBg">
    <img src="assets/images/llsBg.jpg" alt="MM">
  </div>
  <div class="dFlex llsIn">
    <div class="signupBox">
      <h1 class="h2 textCenter mb_20">Sign In</h1>
      <p class="textCenter">Enter your email or phone and password to sign in your account</p>
      <form [formGroup]="loginForm" (ngSubmit)="verificarValor()">
        <div class="lsForm mt_32">
          <div class="formInpt mb_20">
            <input type="text" formControlName="email" placeholder="Enter email or phone">
            <div *ngIf="emailValidate" class="invalid-feedback text-danger">
              Please enter a valid email address.
            </div>
          </div>
          <div class="formInpt shPW mb_20">
            <input type="password" formControlName="password" placeholder="Password">
            <button class="show" role="button">
              <img class="showPW" src="assets/images/pshImgHide.png" alt="MM">
              <img class="hidePW" src="assets/images/pshImgShow.png" alt="MM">
            </button>
            <div *ngIf="passwordValidate" class="invalid-feedback text-danger">
              Password is required and must be at least 6 characters long.
            </div>
          </div>
          <div class="tcc mb_20">
            <label class="tccL txt14 fwBold">
              <input type="checkbox" formControlName="remember">
              <span class="checkmark"></span>
              Remember Me
            </label>
            <a href="#" class="txt14 fwBold">Forgot Password</a>
          </div>
          <button type="submit" class="btnLogin mb_20">Login</button>
          <p class="txt14 fwMedium textCenter">New to Microphone Milionario ? <a routerLink="/register">Signup now.</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</section>
