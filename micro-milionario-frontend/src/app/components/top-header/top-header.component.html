<header class="header" id="header">
    <div class="container">
        <div class="dFlex headerIn">                        
            <a href="javascript:void(0)" class="logo">
                <img src="assets/images/logo.png" alt="MM">
            </a>
            <div class="dFlex headerRight" [ngClass]="profileToggle">
                <ul class="dFlex nav">
                    <li routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="toggleBodyClass()">
                      <a routerLink="/dashboard">Home</a>
                    </li>
                    <li routerLinkActive="active" (click)="toggleBodyClass()">
                      <a routerLink="/dashboard/artists">Artists</a>
                    </li>
                    <li routerLinkActive="active" (click)="toggleBodyClass()">
                      <a routerLink="/dashboard/concursos">Contest</a>
                    </li>
                    <li routerLinkActive="active" (click)="toggleBodyClass()">
                      <a routerLink="/dashboard/winners">Winners</a>
                    </li>
                    <li *ngIf="userRole == '3'" routerLinkActive="active" (click)="toggleBodyClass()">
                      <a routerLink="/dashboard/carteira">Wallet</a>
                    </li>
                    <li routerLinkActive="active" (click)="toggleBodyClass()">
                      <a routerLink="/dashboard/política">Policy</a>
                    </li>
                    <li *ngIf="User.role_name !== 'ARTISTA' && fetchpoints">
                      <a>Pontos: {{ fetchpoints.pontos }}</a>
                    </li>
                  </ul>

                <div class="dFlex hdrSU">
                    <div>
                        <li>
                            <a>{{ User.username }}</a>
                        </li>
                    </div>
                   
                    <!-- <div class="dFlex searchBox" id="searchBox">
                        <input type="text" name="Search" placeholder="Search">
                        <button type="button" id="searchBtn">
                            <img src="assets/images/searchIcon.png" alt="Search">
                        </button>
                    </div> -->
                    <a  class="user" (click)="toggleProfile()">
                        <img [src]="imageUpdate ? imageUpdate  : './assets/images/userProfile.png'" alt="MM">

                    </a>
                    <ul class="userDD" (click)="$event.stopPropagation()">
                        <li>
                            <a (click)="goEditarPerfil(username)">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="" width="800" height="800"
                                    viewBox="0 0 64 64" xmlns:v="https://vecta.io/nano">
                                    <path
                                        d="M32 42c8.271 0 15-8.523 15-19S40.271 4 32 4s-15 8.523-15 19 6.729 19 15 19zm0-34c5.963 0 11 6.869 11 15s-5.037 15-11 15-11-6.869-11-15S26.037 8 32 8zM4.103 45.367l-4 12a2 2 0 0 0 .275 1.802C.753 59.691 1.357 60 2 60h60c.643 0 1.247-.309 1.622-.831a2 2 0 0 0 .275-1.802l-4-12a2 2 0 0 0-1.348-1.29l-14-4a1.99 1.99 0 0 0-1.444.134L32 45.764l-11.105-5.553c-.448-.224-.962-.272-1.444-.134l-14 4a2 2 0 0 0-1.348 1.29zm15.699-1.23l11.304 5.652c.562.281 1.227.281 1.789 0l11.304-5.652 12.238 3.496L59.226 56H4.774l2.789-8.367 12.239-3.496z" />
                                </svg>
                                Perfil
                            </a>
                        </li>
                        <li *ngIf="userRole == '3'">
                            <a routerLink="/dashboard/carteira">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="" width="800" height="800"
                                    viewBox="0 0 32 32" xmlns:v="https://vecta.io/nano">
                                    <path
                                        d="M28.61 11.67H20l-2.66-8.2a1.39 1.39 0 0 0-2.64 0l-2.7 8.2H3.39a1.39 1.39 0 0 0-.82 2.51l7 5.07-2.68 8.21a1.39 1.39 0 0 0 1.32 1.82A1.43 1.43 0 0 0 9 29l7-5.07L23 29a1.43 1.43 0 0 0 .81.27 1.39 1.39 0 0 0 1.32-1.82l-2.66-8.21 7-5.07a1.39 1.39 0 0 0-.86-2.5zm-7.34 6l-1.17.86.44 1.38 2.09 6.41-5.45-4-1.18-.86-1.18.86-5.45 4 2.09-6.41.44-1.38-1.17-.86-5.45-4h8.19l.45-1.38L16 5.89l2.08 6.4.45 1.38h8.19z" />
                                </svg>
                                Wallet
                            </a>
                        </li>
                        <li>
                            <a (click)="logout()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 -0.5 25 25"
                                    fill="none" xmlns:v="https://vecta.io/nano">
                                    <path
                                        d="M11.75 9.874a.75.75 0 1 0 1.5 0h-1.5zM13.25 4a.75.75 0 1 0-1.5 0h1.5zM9.811 6.662a.75.75 0 0 0-.622-1.365l.622 1.365zM5.5 12.16l-.75-.004v.013l.75-.009zm7 6.84l.009-.75-.009.75zm7-6.84l.75.009v-.013l-.75.004zm-3.689-6.864a.75.75 0 0 0-.622 1.365l.622-1.365zM13.25 9.874V4h-1.5v5.874h1.5zM9.189 5.296a7.58 7.58 0 0 0-4.439 6.86l1.5.008a6.08 6.08 0 0 1 3.561-5.502l-.622-1.365zM4.75 12.169c.049 4.236 3.523 7.63 7.759 7.581l-.017-1.5c-3.408.039-6.202-2.691-6.241-6.099l-1.5.017zm7.741 7.581c4.236.049 7.709-3.345 7.759-7.581l-1.5-.017c-.04 3.407-2.834 6.138-6.241 6.099l-.017 1.5zm7.759-7.594a7.58 7.58 0 0 0-4.439-6.86l-.622 1.365a6.08 6.08 0 0 1 3.561 5.502l1.5-.008z"
                                        fill="" />
                                </svg>
                                Logout
                            </a>
                        </li>
                    </ul>
                    <a routerLink="/dashboard" class="menuToggle" (click)="toggleBodyClass()"></a>
                </div>
            </div>
        </div>
    </div>
</header>
